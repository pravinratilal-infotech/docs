# ============================================================
# Docs (PDFDing) — Deploy to Server
#
# Deploys the PdfDing fork to the Hetzner server via SSH + rsync.
# Part of the FundAI platform — deployed to /opt/fundai/docs/.
#
# Builds the pdfding image from this repo's Dockerfile (see
# infra/compose/docker-compose.prod.yml), then restarts the service.
# Migrations run automatically via bootstrap.sh on container start.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   DEPLOY_SSH_KEY — private SSH key (fundai_ed25519) for server access
#   SERVER_IP      — Hetzner server IP (e.g. 46.224.188.96)
# ============================================================

name: Deploy to Server

on:
  push:
    branches: [master]
    paths:
      - 'pdfding/**'
      - 'bootstrap.sh'
      - 'supervisord.conf'
      - 'Dockerfile'
      - 'pyproject.toml'
      - 'poetry.lock'
      - 'package.json'
      - 'package-lock.json'
      - '.dockerignore'
      - '.github/workflows/deploy-server.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync docs source to server
        run: |
          SSH_CMD="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no"
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='__pycache__' \
            --exclude='*.pyc' \
            --exclude='.venv' \
            --exclude='pg_data' \
            --exclude='dev' \
            --exclude='pdfding/db' \
            --exclude='pdfding/media' \
            --exclude='pdfding/staticfiles' \
            -e "$SSH_CMD" \
            ./ root@${{ secrets.SERVER_IP }}:/opt/fundai/docs/

      - name: Ensure Google Drive service account key is mounted
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            root@${{ secrets.SERVER_IP }} bash -s << 'REMOTE'
          set -euo pipefail
          SECRETS_DIR=/opt/fundai/compose/secrets
          KEY_NAME=google-drive-service-account.json
          DEST="$SECRETS_DIR/$KEY_NAME"
          mkdir -p "$SECRETS_DIR"
          if [ ! -f "$DEST" ]; then
            for src in \
              /opt/fundai/docs/secrets/$KEY_NAME \
              /opt/fundai/docs/dev/secrets/$KEY_NAME; do
              if [ -f "$src" ]; then
                cp "$src" "$DEST"
                chown 1000:1000 "$DEST"
                chmod 640 "$DEST"
                echo "Installed GDrive key from $src"
                break
              fi
            done
          fi
          if [ ! -f "$DEST" ]; then
            echo "WARNING: GDrive key not found at $DEST (tab will show an error until key is installed)"
          fi
          REMOTE

      - name: Build and restart PDFDing on server
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            root@${{ secrets.SERVER_IP }} bash -s << 'REMOTE'
          set -euo pipefail
          cd /opt/fundai
          docker compose -f compose/docker-compose.prod.yml --env-file .env build pdfding
          docker compose -f compose/docker-compose.prod.yml --env-file .env up -d pdfding
          echo "✅ PDFDing deploy complete"
          REMOTE

      - name: Health check
        run: |
          DOCS_DOMAIN="docs.$(echo '${{ secrets.SERVER_IP }}' | tr '.' '-').sslip.io"
          for i in $(seq 1 15); do
            STATUS=$(curl -sk -o /dev/null -w "%{http_code}" "https://${DOCS_DOMAIN}/" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo "✅ Health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Waiting... ($i/15, status=$STATUS)"
            sleep 10
          done
          echo "❌ Health check failed"
          exit 1
